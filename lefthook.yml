pre-commit:
  parallel: true
  commands:
    biome:
      run: pnpm check
    cargo-fmt:
      root: src-tauri/
      run: cargo fmt --check --all
    clippy:
      root: src-tauri/
      run: cargo clippy -- -D warnings

pre-push:
  commands:
    vitest:
      run: pnpm test
    cargo-test:
      root: src-tauri/
      run: cargo test
