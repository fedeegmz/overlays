[package]
name = "overlays"
version = "0.2.0"
description = "Overlay controller for OBS — manage multiple overlay instances via a local WebSocket server"
authors = ["Federico Gomez"]
license = "MIT"
edition = "2021"

[lib]
name = "overlays_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
anyhow = "1"
dunce = "1"
unicode-normalization = "0.1.25"
keyring = { version = "4", features = ["apple-native-keyring-store", "windows-native-keyring-store", "zbus-secret-service-keyring-store"] }
uuid = { version = "1.26.1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tokio-tungstenite = "0.28"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["fs"] }

[profile.release]
