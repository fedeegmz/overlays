[package]
name = "overlays"
version = "0.2.0"
description = "Overlay controller for OBS — manage multiple overlay instances via a local WebSocket server"
authors = ["Federico Gomez"]
license = "MIT"
edition = "2021"

[lib]
name = "overlays_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
anyhow = "1"
dunce = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tokio-tungstenite = "0.28"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
